[package]
name = "agent-limit-monitor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Compact desktop monitor for ChatGPT, Z.AI AutoClaw and DeepSeek limits"
homepage = "https://github.com/sstpnk/Claude-Code-Usage-Monitor"
repository = "https://github.com/sstpnk/Claude-Code-Usage-Monitor"

[package.metadata.winres]
CompanyName = "Sergey Stepanyuk"
ProductName = "Agent Limit Monitor"
FileDescription = "Agent Limit Monitor"
OriginalFilename = "agent-limit-monitor.exe"
InternalName = "AgentLimitMonitor"
Comments = "https://github.com/sstpnk/Claude-Code-Usage-Monitor"
LegalCopyright = "Copyright (C) 2026 Sergey Stepanyuk"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
aes-gcm = "0.10"
base64 = "0.22"
md-5 = "0.10"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
